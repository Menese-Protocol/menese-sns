Swap:
    # If fewer than this many people join, or less than the minimum raise is reached,
    # the swap does not complete and every participant is refunded in full.
    minimum_participants: 50

    minimum_direct_participation_icp: 100_000 tokens
    maximum_direct_participation_icp: 500_000 tokens

    minimum_participant_icp: 5 tokens
    maximum_participant_icp: 60_000 tokens

    # No country is blocked from taking part. Menese does not blacklist people from
    # its own DAO. Each participant confirms below that they are responsible for
    # their own position under the laws that apply to them.
    confirmation_text: >
        I confirm that I understand MENES is a governance token for the Menese
        Protocol DAO, that its value can fall as well as rise, and that participating
        in this swap is not an investment in any company. I confirm that I am
        responsible for my own participation and that it is permitted under the laws
        that apply to me.

    # Swap participants receive a basket of eight neurons whose dissolve delays step
    # up by 182 days, from 0 up to 1,274 days.
    #
    # This is longer than a conventional unlock ladder, and it is longer on purpose.
    # A neuron carries no voting power at all until its dissolve delay reaches the
    # 26 week minimum set under Voting above, and its weight then rises with that
    # delay. A short ladder therefore hands the public a token position without the
    # governance position that is supposed to come with it. Under a five by 73 day
    # ladder, three of every five neurons in a participant's basket could not vote at
    # genesis, and the swap's 10% of supply carried 10.8% of the voting power. Under
    # the schedule below it carries 25.3%.
    VestingSchedule:
        events: 8
        interval: 182 days

    # Time of day the swap opens. The calendar date is set when the NNS proposal
    # executes, not here.
    start_time: 12:00 UTC
    duration: 21 days

    # The Neurons' Fund does not participate. The raise comes from direct
    # participants only, and their share is not diluted by matched NNS capital.
    neurons_fund_participation: false
