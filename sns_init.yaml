Token:
    name: Menese Protocol
    symbol: MENES
    transaction_fee: 10_000 e8s
    logo: logo.png

Proposals:
    rejection_fee: 100 tokens
    initial_voting_period: 4 days
    maximum_wait_for_quiet_deadline_extension: 1 day

Neurons:
    # 10 MENES minimum to create a neuron. Kept low deliberately: this value sets the
    # floor on minimum_participant_icp below, and a high floor prices out small participants.
    minimum_creation_stake: 1_000_000_000 e8s

Voting:
    minimum_dissolve_delay: 26 weeks

    MaximumVotingPowerBonuses:
        DissolveDelay:
            duration: 4 years
            bonus: 100%
        Age:
            duration: 4 years
            bonus: 25%

    # Fixed 100,000,000 supply with no inflation: the DAO does not mint new tokens to
    # pay voting rewards. Same choice onicai made for their fixed-cap launch.
    RewardRate:
        initial: 0%
        final: 0%
        transition_duration: 0 seconds

